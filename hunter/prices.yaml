# Comparison prices for repaired units, used by the scorer.
#
# Every number here is an ESTIMATE seeded from the plan (asking prices and refurbisher
# prices, discounted). Replace each resale_p50 with the median of 10+ eBay *sold*
# results (eBay search -> filter "Verkaufte Artikel") before you trust the EV numbers.
#
#   match:         regexes (case-insensitive) tried against title + description;
#                  models are tried in file order and the first match wins
#   resale_p50:    typical sale price after repair, € incl. shipping
#   salvage:       what the parts bring if the repair fails, €
#   repair_hours:  typical hands-on time for a common fault (diagnosis, fix, test)
#   default_parts: parts budget when the fault is unclear, €
#   ship_out:      override the default outbound shipping (bulky items)

laptops:
  thinkpad_t480:
    label: ThinkPad T480 / T480s
    match: ['\bt480s?\b']
    resale_p50: 185
    salvage: 60
    repair_hours: 1.0
    default_parts: 35

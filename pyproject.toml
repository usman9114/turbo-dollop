[project]
name = "huntbot"
version = "0.1.0"
description = "Deal finder for repair-and-flip: Kleinanzeigen alert emails, eBay Browse API and a browser companion, scored by expected value."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2.3"]

[project.scripts]
huntbot = "huntbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["huntbot*"]

[tool.setuptools.package-data]
huntbot = ["static/*", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

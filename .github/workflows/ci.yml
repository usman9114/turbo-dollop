name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (userscript + web UI, fixture pages only)
        run: node tests/e2e/userscript_e2e.js

      - name: Build Claude skill
        run: python scripts/build_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: product-hunter-skill
          path: dist/product-hunter.zip

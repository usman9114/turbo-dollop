# Scheduled deal hunt → Telegram push.
#
# Runs ONLY the ToS-safe sources: Kleinanzeigen alert emails (your mailbox) + eBay Browse API
# (official) for the queries in hunts.txt. Live Kleinanzeigen search is forced OFF here:
# a schedule on GitHub's servers is exactly the automated polling Kleinanzeigen forbids.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID          required for push
#   IMAP_USER, IMAP_PASSWORD (IMAP_HOST optional)  alert emails
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET             eBay API
#   OPENROUTER_API_KEY                             optional: screening team (GLM / free models)
#   ANTHROPIC_API_KEY                              optional: Claude screening (used if no OpenRouter key)
#
# Minutes: every 30 min ≈ 1,450 min/month (private repos get 2,000 free). Public repos: unlimited.
name: Deal hunt

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 min, off the :00 rush (GitHub may delay a few minutes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deal-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUNTBOT_DB: state/huntbot.db
      HUNTBOT_ONDEMAND: "false"
      HUNTBOT_LLM_ENABLED: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.OPENROUTER_API_KEY != '' }}
      HUNTBOT_SCREEN_PROVIDER: auto
      HUNTBOT_AGENT_PROFILE: glm            # glm | free
      HUNTBOT_TEAM_ENFORCE: "false"         # shadow mode until you have reviewed the verdicts
      HUNTBOT_AGENT_MAX_USD_DAY: "0.50"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST || 'imap.gmail.com' }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      # The SQLite DB (seen listings, scores, price-model training data) lives in the Actions cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: huntbot-db-${{ github.run_id }}
          restore-keys: huntbot-db-

      - run: mkdir -p state
      - name: Hunt (alert mails + eBay) and push alerts to Telegram
        run: huntbot run-once --hunts hunts.txt --telegram-commands

      - name: Screening team status (logs only)
        if: always()
        run: huntbot agents-status --offline || true

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: huntbot-db-${{ github.run_id }}

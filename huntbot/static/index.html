<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huntbot</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #2f5d50; --good: #1f7a4d; --warn: #a15c00; --bad: #b3261e; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1e1f1c; --text: #ecebe6; --muted: #a09f99; --line: #33342f;
            --accent: #7fb8a4; --good: #6fcf97; --warn: #f2b25c; --bad: #ff8a80; --chip: #2a2b27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 320px; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line);
                       border-radius: 10px; background: var(--panel); color: var(--text); }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  .live { flex-basis: 100%; font-size: 13px; color: var(--muted); }
  .status { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; }
  .chip.on { color: var(--good); } .chip.off { color: var(--muted); text-decoration: line-through; }
  .links { margin: 20px 0; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .links h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .links a { display: inline-block; margin: 2px 10px 2px 0; color: var(--accent); }
  .results { display: grid; gap: 10px; }
  .card { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; padding: 12px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; align-items: start; }
  .card.alert { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
  .card.rejected { opacity: .55; }
  .thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--chip); }
  .title { font-weight: 600; color: var(--text); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .meta, .why { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .flags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .flag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--warn); }
  .flag.bad { color: var(--bad); }
  .num { text-align: right; min-width: 120px; }
  .ev { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ev.pos { color: var(--good); } .ev.neg { color: var(--bad); }
  .small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .copy { margin-top: 6px; padding: 4px 10px; font-size: 12px; background: var(--chip); color: var(--text); }
  .empty, .err { padding: 20px; color: var(--muted); }
  .err { color: var(--bad); }
  details { margin-top: 18px; color: var(--muted); font-size: 13px; }
  details input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  @media (max-width: 640px) {
    .card { grid-template-columns: 72px 1fr; }
    .thumb { width: 72px; height: 56px; }
    .num { grid-column: 1 / -1; text-align: left; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<main>
  <h1>Huntbot</h1>
  <p class="sub">Search broken-but-fixable deals. Ranked by expected profit after fees, §25a VAT and warranty reserve.</p>
  <form id="f">
    <input type="search" id="q" placeholder="e.g. thinkpad t14 defekt bis 150" autocomplete="off" autofocus>
    <button id="go" type="submit">Hunt</button>
    <label id="livebox" class="live" hidden><input type="checkbox" id="live"> also search Kleinanzeigen live (1 page, ≥30 s apart)</label>
  </form>
  <div class="status" id="status"></div>
  <div id="links"></div>
  <div class="results" id="results"></div>
  <details>
    <summary>Settings</summary>
    <p>API token (HUNTBOT_TOKEN): <input id="token" type="password" size="28"></p>
  </details>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (v) => v == null ? "?" : "€" + Math.round(v);
const BAD = new Set(["activation_lock", "mdm_or_autopilot", "not_the_device"]);

let token = "";
try { token = localStorage.getItem("huntbot-token") || ""; } catch (e) {}
$("token").value = token;
$("token").addEventListener("change", (e) => { token = e.target.value; try { localStorage.setItem("huntbot-token", token); } catch (err) {} });

fetch("/api/status").then((r) => r.json()).then((s) => {
  $("livebox").hidden = !s.live;
  $("status").innerHTML = [["Claude", s.llm], ["eBay API", s.ebay], ["Kleinanzeigen live", s.live], ["Alert emails", s.imap], ["Telegram", s.telegram]]
    .map(([n, on]) => `<span class="chip ${on ? "on" : "off"}">${n}</span>`).join("");
});

function card(r) {
  const s = r.score, sc = r.screen;
  const price = r.price === 0 ? "free" : eur(r.price) + (r.negotiable ? " VB" : "");
  const flags = sc.red_flags.map((f) => `<span class="flag ${BAD.has(f) ? "bad" : ""}">${esc(f)}</span>`).join("");
  const cls = s.rejected ? "rejected" : (s.alert ? "alert" : "");
  return `<div class="card ${cls}">
    ${r.image ? `<img class="thumb" src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="thumb"></div>`}
    <div>
      <a class="title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <div class="meta">${esc(r.source)} · ${price} · ${esc(r.location || "–")} · ${esc(sc.device_model)}</div>
      <div class="why">${esc(sc.fault_summary)} · p_ok ${s.p_ok.toFixed(2)} · parts ${eur(sc.parts_cost_eur)} · ${s.hours.toFixed(1)} h</div>
      <div class="flags">${flags}</div>
      <div class="why">${esc(s.reasons.join("; "))} · <i>${esc(r.model_used)}</i></div>
    </div>
    <div class="num">
      <div class="ev ${s.rejected || s.ev < 0 ? "neg" : "pos"}">${s.rejected ? "REJECT" : eur(s.ev)}</div>
      <div class="small">${eur(s.ev_per_hour)}/h · ROI ${Math.round(s.roi * 100)}%</div>
      <div class="small">max buy ${eur(s.max_buy)} · sell on ${esc(s.sell_on)} ${eur(s.resale)}</div>
      ${r.verdict ? `<div class="small"><b>${esc(r.verdict.decision)}</b> (${esc(r.verdict.confidence)}) ${esc((r.verdict.reasons || [""])[0])}</div>` : ""}
      <div class="small">${s.mode === "flip" ? "⚡ quick flip" : "🔧 repair"}${s.discount != null ? ` · ${Math.round(s.discount * 100)}% under typ. ${eur(s.fair_ask)}` : ""}</div>
      ${r.offer ? `<button class="copy" data-offer="${esc(r.offer)}">Copy offer</button>` : ""}
    </div>
  </div>`;
}

$("results").addEventListener("click", async (e) => {
  const b = e.target.closest(".copy");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.offer); b.textContent = "Copied"; }
  catch (err) { prompt("Copy the offer:", b.dataset.offer); }
});

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true; $("go").textContent = "Hunting…";
  $("results").innerHTML = ""; $("links").innerHTML = "";
  try {
    const live = $("live").checked ? "&live_search=true" : "";
    const res = await fetch("/api/hunt?q=" + encodeURIComponent(q) + live, { headers: { "X-Huntbot-Token": token } });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    const links = data.kleinanzeigen_links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.phrase)}</a>`).join("");
    $("links").innerHTML = `<div class="links"><h2>Open on Kleinanzeigen (the userscript scores what you see, or save as a search alert)</h2>${links}
      <h2 style="margin-top:10px">Check real sold prices</h2><a href="${esc(data.ebay_sold_url)}" target="_blank" rel="noopener">eBay sold listings</a>
      ${(data.live || []).map((l) => `<div class="small">Kleinanzeigen live: ${l.count} listings fetched</div>`).join("")}
      ${data.errors.length ? `<div class="err">${esc(data.errors.join("; "))}</div>` : ""}</div>`;
    $("results").innerHTML = data.results.length ? data.results.map(card).join("")
      : `<div class="empty">Nothing stored yet for this query. Open a Kleinanzeigen link above with the userscript installed, connect alert emails, or add eBay keys.</div>`;
  } catch (err) {
    $("results").innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally {
    $("go").disabled = false; $("go").textContent = "Hunt";
  }
});
</script>
</body>
</html>
